name: Java CI with Gradle

on:
  push:
    branches: [ "1.21.1" ]
  pull_request:
    branches: [ "1.21.1" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MODRINTH_TOKEN: ${{ secrets.MR_API_TOKEN }}
      CURSEFORGE_TOKEN: ${{ secrets.CF_API_TOKEN }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: false

    - name: Build with Gradle
      run: ./gradlew build

    - name: Upload Fabric Artifact
      uses: actions/upload-artifact@v4
      with:
        name: fabric-artifact
        path: fabric/build/libs/*.jar

    - name: Upload NeoForge Artifact
      uses: actions/upload-artifact@v4
      with:
        name: neoforge-artifact
        path: neoforge/build/libs/*.jar

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - uses: actions/checkout@v4
    - name: Download Fabric Artifact
      uses: actions/download-artifact@v4
      with:
        name: fabric-artifact
    - name: Download NeoForge Artifact
      uses: actions/download-artifact@v4
      with:
        name: neoforge-artifact
    - name: Get tag
      id: tag
      uses: dawidd6/action-get-tag@v1
    - uses: jungwinter/split@v2
      id: split
      with:
        separator: "+"
        msg: ${{steps.tag.outputs.tag}}
    - name: Upload Fabric
      uses: Kir-Antipov/mc-publish@v3
      with:
        modrinth-id: x3HZvrj6
        modrinth-token: ${{ env.MODRINTH_TOKEN }}
        curseforge-id: 666014
        curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
        name: "[Fabric ${{steps.split.outputs._1}}] Immersive Aircraft - ${{steps.split.outputs._0}}"
        changelog-file: changelog.md
        version-type: release
        files: "fabric/build/libs/*.jar"
        loaders: fabric
        game-versions: ${{steps.split.outputs._1}}
        java: Java 21
        dependencies: fabric-api | required | *
        fail-mode: skip
    - name: Upload NeoForge
      uses: Kir-Antipov/mc-publish@v3
      with:
        modrinth-id: x3HZvrj6
        modrinth-token: ${{ env.MODRINTH_TOKEN }}
        curseforge-id: 666014
        curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
        name: "[NeoForge ${{steps.split.outputs._1}}] Immersive Aircraft - ${{steps.split.outputs._0}}"
        changelog-file: changelog.md
        version-type: release
        files: "neoforge/build/libs/*.jar"
        loaders: neoforge
        game-versions: ${{steps.split.outputs._1}}
        java: Java 21
        fail-mode: skip

  dependency-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@v4
